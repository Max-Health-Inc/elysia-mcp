name: Publish

# Releasing = bumping the version in your PR. A merge whose version is already on the
# registry publishes nothing and says so in the run summary.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Stated rather than inherited: a reusable workflow cannot hold MORE permission than its
# caller, and a repository whose default is `read` then fails at STARTUP with no log. This
# repository's default happens to be `write`, but a default is not a contract.
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      runtime: bun
      # The existing @maxhealth.tech scope, beside the mcp-http package this one names
      # as its HTTP edge. No new npm org.
      scope: '@maxhealth.tech'
      registry: https://registry.npmjs.org
      check-steps: lint typecheck test build
    secrets: inherit
