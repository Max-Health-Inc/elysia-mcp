name: Check

# max-network's shared gate, called rather than copied.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      # bun, because the suite imports `bun:test` — Elysia is bun-first. The library's
      # own source uses no bun globals, so the published package still suits node.
      runtime: bun
      steps: lint typecheck test build smoke
    secrets: inherit
